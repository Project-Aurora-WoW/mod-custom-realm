# ============================================================
# setup-tree/action.yml — composite action: подготовка дерева сборки
#
# Используется обоими job'ами (linux, windows) workflow core-build.
# Клонирует мастер-ядро AzerothCore и встраивает в него модули реалма:
#   • modules/echo-*            — кастомные C++-модули реалма (7 шт.)
#   • mod-ale                   — обязательный Lua-движок ALE
#   • lua_scripts/              — копируются в env/dist/bin/lua_scripts
#                                (для dry-run; ALE читает их оттуда)
#
# Выходы:
#   core-dir:   путь к клонированному ядру (${{ github.workspace }}/azerothcore-wotlk)
# ============================================================
name: setup-tree
description: Checkout AzerothCore master and install realm modules

outputs:
  core-dir:
    description: Path to the cloned AzerothCore tree
    value: ${{ steps.out.val }}

runs:
  using: composite
  steps:
    # ---- Ядро (внешний репозиторий) ----
    - name: Checkout AzerothCore master
      uses: actions/checkout@v4
      with:
        repository: azerothcore/azerothcore-wotlk
        ref: master
        submodules: recursive
        path: azerothcore-wotlk

    # ---- Репозиторий реалма (этот) ----
    - name: Checkout realm repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: realm

    # ---- Встройка кастомных модулей echo-* ----
    - name: Install realm modules into the core
      shell: bash
      run: |
        set -euo pipefail
        for mod in echo-balance echo-challenge-modes echo-campaigns echo-economy \
                   echo-pve echo-pvp echo-startup; do
          if [ -d "realm/modules/$mod" ]; then
            rm -rf "azerothcore-wotlk/modules/$mod"
            cp -R "realm/modules/$mod" "azerothcore-wotlk/modules/$mod"
          fi
        done
        echo "Installed realm modules:"
        ls -1 azerothcore-wotlk/modules/ | grep '^echo-'

    # ---- mod-ale (обязательный Lua-движок ALE) ----
    # Ядро без mod-ale собирается, но lua_scripts/ не загружаются вовсе.
    - name: Checkout mod-ale (Lua engine ALE)
      uses: actions/checkout@v4
      with:
        repository: azerothcore/mod-ale
        ref: master
        submodules: recursive
        path: azerothcore-wotlk/modules/mod-ale

    # ---- Стандартные модули AC (Фаза 5.1) ----
    # Параллельно local setup-build.sh (scripts/setup-build.sh). Каждый модуль —
    # отдельный checkout в azerothcore-wotlk/modules/<name>, чтобы AC собрал его
    # вместе с ядром и mod-ale. Ветка master + submodules как у остальных.
    - name: Checkout standard AC modules (Phase 5.1)
      shell: bash
      run: |
        set -euo pipefail
        declare -A MODS=(
          [mod-ah-bot]="https://github.com/azerothcore/mod-ah-bot.git"
          [mod-transmog]="https://github.com/azerothcore/mod-transmog.git"
          [mod-cfbg]="https://github.com/azerothcore/mod-cfbg.git"
          [mod-duel-reset]="https://github.com/azerothcore/mod-duel-reset.git"
          [mod-solocraft]="https://github.com/azerothcore/mod-solocraft.git"
        )
        for name in "${!MODS[@]}"; do
          git clone --depth 1 --branch master --single-branch --recursive \
            "${MODS[$name]}" "azerothcore-wotlk/modules/$name"
        done
        echo "Standard modules installed:"
        ls -1 azerothcore-wotlk/modules/ | grep -E '^(mod-ah-bot|mod-transmog|mod-cfbg|mod-duel-reset|mod-solocraft)$'

    # ---- Vendor Lua 5.2.4 (обход блокировки www.lua.org на CI-раннерах) ----
    # mod-ale объявляет Lua через FetchContent (src/lualib/lua/CMakeLists.txt) и
    # качает lua-5.2.4.tar.gz с www.lua.org, который на GitHub Actions/части сетей
    # недоступен ("SSL connect/Connection was reset", код 35). Достаём исходники
    # из GitHub-зеркала lua/lua (tag v5.2.4) и указываем FetchContent готовую
    # папку, чтобы тот пропустил download/verify. Обе рабочих переменные
    # (upper/lower) выставляются для совместимости с версиями CMake.
    - name: Vendor Lua 5.2.4 (FetchContent override, lua.org is blocked)
      shell: bash
      run: |
        set -euo pipefail
        LUA_SRC="$GITHUB_WORKSPACE/lua-5.2.4"
        if [ ! -d "$LUA_SRC" ]; then
          curl -fsSL -o "$GITHUB_WORKSPACE/lua-5.2.4.tar.gz" \
            https://github.com/lua/lua/archive/refs/tags/v5.2.4.tar.gz
          mkdir -p "$GITHUB_WORKSPACE/_lua_extract"
          tar -xzf "$GITHUB_WORKSPACE/lua-5.2.4.tar.gz" -C "$GITHUB_WORKSPACE/_lua_extract"
          mv "$GITHUB_WORKSPACE/_lua_extract/lua-5.2.4" "$LUA_SRC"
        fi
        test -f "$LUA_SRC/src/lua.c" || { echo "missing $LUA_SRC/src/lua.c"; exit 1; }
        {
          echo "FETCHCONTENT_SOURCE_DIR_lua52=$LUA_SRC"
          echo "FETCHCONTENT_SOURCE_DIR_LUA52=$LUA_SRC"
        } >> "$GITHUB_ENV"
        echo "Vendored Lua 5.2.4 at $LUA_SRC"

    # ---- Прокинуть lua_scripts в данные ядра (dry-run) ----
    - name: Stage lua_scripts for dry-run
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p azerothcore-wotlk/env/dist/bin/lua_scripts
        cp -R realm/lua_scripts/. azerothcore-wotlk/env/dist/bin/lua_scripts/

    - name: Set output
      id: out
      shell: bash
      run: echo "val=${{ github.workspace }}/azerothcore-wotlk" >> "$GITHUB_OUTPUT"