# ============================================================
# setup-tree/action.yml — composite action: подготовка дерева сборки
#
# Используется обоими job'ами (linux, windows) workflow core-build.
# Клонирует мастер-ядро AzerothCore и встраивает в него модули реалма:
#   • modules/*  — ВСЕ модули сборки реалма (echo-*, mod-ale, внешние мод-*),
#                  копируются в ядро как снапшоты (без .git)
#   • lua_scripts/  — копируются в env/dist/bin/lua_scripts
#                   (для dry-run; ALE читает их оттуда)
#
# Выходы:
#   core-dir:   путь к клонированному ядру (${{ github.workspace }}/azerothcore-wotlk)
# ============================================================
name: setup-tree
description: Checkout AzerothCore master and install realm modules

outputs:
  core-dir:
    description: Path to the cloned AzerothCore tree
    value: ${{ steps.out.val }}

runs:
  using: composite
  steps:
    # ---- Ядро (внешний репозиторий) ----
    - name: Checkout AzerothCore master
      uses: actions/checkout@v4
      with:
        repository: azerothcore/azerothcore-wotlk
        ref: master
        submodules: recursive
        path: azerothcore-wotlk

    # ---- Репозиторий реалма (этот) ----
    - name: Checkout realm repo
      uses: actions/checkout@v4
      with:
        submodules: recursive
        path: realm

    # ---- Встройка ВСЕХ вендоренных модулей реалма в ядро ----
    # Все модули сборки (echo-*, mod-ale, внешние mod-* as-есть снапшоты без .git)
    # живут в modules/ этого репо и копируются в ядро при сборке — внешние
    # клоны модулей НЕ используются (commits 9f95550). Версия модуля фиксируется
    # содержимым modules/ этого репозитория, а не git clone/SHA из upstream.
    - name: Install all vendored realm modules into the core
      shell: bash
      run: |
        set -euo pipefail
        for mod in realm/modules/*/; do
          name="$(basename "$mod")"
          [ -d "$mod" ] || continue
          rm -rf "azerothcore-wotlk/modules/$name"
          cp -R "$mod" "azerothcore-wotlk/modules/$name"
        done
        echo "Installed modules:"
        ls -1 azerothcore-wotlk/modules/ | grep -E '^(echo-|mod-ale|mod-)'

    # ---- Vendor Lua 5.2.4 (обход блокировки www.lua.org на CI-раннерах) ----
    # mod-ale объявляет Lua через FetchContent (src/lualib/lua/CMakeLists.txt) и
    # качает lua-5.2.4.tar.gz с www.lua.org, который на GitHub Actions/части сетей
    # недоступен ("SSL connect/Connection was reset", код 35). Достаём исходники
    # из GitHub-зеркала LuaDist/lua (tag 5.2.4; lua/lua такой тег не публикует)
    # и указываем FetchContent готовую папку, чтобы тот пропустил download/verify.
    # Обе рабочие переменные (upper/lower) выставляются для совместимости с CMake.
    - name: Vendor Lua 5.2.4 (FetchContent override, lua.org is blocked)
      shell: bash
      run: |
        set -euo pipefail
        LUA_SRC="$GITHUB_WORKSPACE/lua-5.2.4"
        if [ ! -d "$LUA_SRC" ]; then
          # lua/lua не публикует тег v5.2.4 (теги начинаются с v5.3.3);
          # используем зеркало LuaDist/lua с тегом 5.2.4 (распаковывается в
          # lua-5.2.4/ и содержит src/lua.c). www.lua.org заблокирован (код 35).
          curl -fsSL -o "$GITHUB_WORKSPACE/lua-5.2.4.tar.gz" \
            https://github.com/LuaDist/lua/archive/refs/tags/5.2.4.tar.gz
          # Распаковка через Python, а не tar: на Windows-раннере $GITHUB_WORKSPACE
          # = D:\\a\\... и GNU tar путает "D:" с удалённым узлом
          # ("Cannot connect to D: resolve failed"). shutil.unpack_archive
          # кросс-платформенный и не зависит от буквы диска.
          python - <<'PY'
          import shutil, os
          ws = os.environ["GITHUB_WORKSPACE"]
          shutil.unpack_archive(os.path.join(ws, "lua-5.2.4.tar.gz"), os.path.join(ws, "_lua_extract"))
          shutil.move(os.path.join(ws, "_lua_extract", "lua-5.2.4"), os.path.join(ws, "lua-5.2.4"))
          PY
          rm -rf "$GITHUB_WORKSPACE/_lua_extract"
        fi
        test -f "$LUA_SRC/src/lua.c" || { echo "missing $LUA_SRC/src/lua.c"; exit 1; }
        {
          echo "FETCHCONTENT_SOURCE_DIR_lua52=$LUA_SRC"
          echo "FETCHCONTENT_SOURCE_DIR_LUA52=$LUA_SRC"
        } >> "$GITHUB_ENV"
        echo "Vendored Lua 5.2.4 at $LUA_SRC"

    # ---- Прокинуть lua_scripts в данные ядра (dry-run) ----
    - name: Stage lua_scripts for dry-run
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p azerothcore-wotlk/env/dist/bin/lua_scripts
        cp -R realm/lua_scripts/. azerothcore-wotlk/env/dist/bin/lua_scripts/

    - name: Set output
      id: out
      shell: bash
      run: echo "val=${{ github.workspace }}/azerothcore-wotlk" >> "$GITHUB_OUTPUT"